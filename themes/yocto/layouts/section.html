{{ define "main" }}
  <header>
    <h1>{{ .Title }}</h1>
  </header>
  {{ .Content }}
  {{- $pages := .Pages }}
  {{- $length := $pages | len }}
  <nav role="feed" aria-setsize="{{ $length }}" aria-label="{{ .Title }}" aria-busy="false">
    <ul>
      {{- range $index, $page := $pages }}
      {{    partial "post-card" (dict "Page" $page "Index" $index "SetSize" $length) }}
      {{- end }}
    </ul>
  </nav>
{{ end }}
